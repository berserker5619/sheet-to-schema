name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Verify and pack, but do not publish'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm provenance

env:
  CI: true

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check bundle boundaries
        run: npm run check:bundle

      - name: Check package metadata
        run: npm run check:package

      - name: Test
        run: npm run test

      - name: Coverage thresholds
        run: npm run test:coverage

      - name: Dates in every timezone
        run: npm run check:timezones

      - name: Consumer install from tarball
        run: npm run check:consumer

      # Trusted publishing needs npm >= 11.5.1, newer than the npm bundled with Node, so it is
      # installed. Pinned, not @latest: a release should not change the tool that publishes it
      # on the day a new npm comes out. 12.2.0 published 1.0.0-rc.3 through trusted publishing,
      # with provenance and the `latest` dist-tag move. Raise it deliberately.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@12.2.0
          echo "npm $(npm --version) on node $(node --version)"

      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::package.json is $VERSION but tag is $TAG"
            exit 1
          fi
          echo "Tag and package.json match: $TAG"

      - name: Package already exists on registry
        if: ${{ github.event_name == 'push' || github.event.inputs.dry_run != 'true' }}
        run: |
          if OUT=$(npm view sheet-to-schema version 2>&1); then
            echo "sheet-to-schema is on the registry at $OUT"
          else
            case "$OUT" in
              *E404*)
                echo "::error::First publish needed for sheet-to-schema"
                exit 1
                ;;
              *)
                echo "::error::Could not reach registry"
                echo "$OUT"
                exit 1
                ;;
            esac
          fi

      - name: Publish sheet-to-schema
        if: ${{ github.event_name == 'push' || github.event.inputs.dry_run != 'true' }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG=$(node -p "require('./package.json').version.includes('-') ? 'next' : 'latest'")
          if npm view "sheet-to-schema@$VERSION" version >/dev/null 2>&1; then
            echo "sheet-to-schema@$VERSION is already published — skipping."
          else
            npm publish --access public --tag "$TAG" --provenance --loglevel verbose
            if [ "$TAG" = "next" ]; then
              CURRENT_LATEST=$(npm view sheet-to-schema dist-tags.latest 2>/dev/null || true)
              case "$CURRENT_LATEST" in
                *-*)
                  echo "sheet-to-schema latest dist-tag is a prerelease ($CURRENT_LATEST) — advancing latest to $VERSION."
                  if ! npm dist-tag add "sheet-to-schema@$VERSION" latest; then
                    echo "::warning::Could not update 'latest' dist-tag via trusted publishing (OIDC token may lack dist-tag permissions)."
                    echo "::warning::To update manually, run: npm dist-tag add sheet-to-schema@$VERSION latest"
                  fi
                  ;;
                *)
                  echo "sheet-to-schema latest dist-tag is stable ($CURRENT_LATEST) — leaving latest unchanged."
                  ;;
              esac
            else
              # A stable release goes out as `latest`. `next` is moved up to it when it points at
              # an older version, so `npm install sheet-to-schema@next` never installs something
              # older than `latest`. A `next` that is already ahead (a newer prerelease) is left.
              CURRENT_NEXT=$(npm view sheet-to-schema dist-tags.next 2>/dev/null || true)
              if [ -z "$CURRENT_NEXT" ]; then
                echo "sheet-to-schema has no next dist-tag — nothing to move."
              elif node scripts/semver-lt.mjs "$CURRENT_NEXT" "$VERSION"; then
                echo "sheet-to-schema next dist-tag ($CURRENT_NEXT) is older than $VERSION — advancing next to $VERSION."
                if ! npm dist-tag add "sheet-to-schema@$VERSION" next; then
                  echo "::warning::Could not update 'next' dist-tag via trusted publishing (OIDC token may lack dist-tag permissions)."
                  echo "::warning::To update manually, run: npm dist-tag add sheet-to-schema@$VERSION next"
                fi
              else
                echo "sheet-to-schema next dist-tag ($CURRENT_NEXT) is not older than $VERSION — leaving next unchanged."
              fi
            fi
          fi

      - name: Pack only (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        run: npm pack --dry-run
