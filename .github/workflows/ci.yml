name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  FORCE_COLOR: 0

jobs:
  matrix-test:
    name: Node ${{ matrix.node }} build + test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  full-gate:
    name: Node 24 full gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Check bundle boundaries
        run: npm run check:bundle
      - name: Check package metadata
        run: npm run check:package
      - name: Test
        run: npm run test
      - name: Coverage thresholds
        run: npm run test:coverage
      - name: Dates in every timezone
        run: npm run check:timezones
      - name: Consumer install from tarball
        run: npm run check:consumer
      - name: The browser reader on this runtime
        run: npm run check:browser-runtime

  # Node 20.11 has DecompressionStream but not its "deflate-raw" format, as Chrome and Edge 80-102
  # do. /browser must still read a CSV there, and refuse a workbook with UNSUPPORTED_RUNTIME
  # rather than let the constructor's TypeError escape (R1-1 in docs/1.1-rc-feedback.md).
  old-runtime:
    name: Node 20.11 /browser without deflate-raw
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20.11.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-browser-runtime.mjs --expect-unsupported
