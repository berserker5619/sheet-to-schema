name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  FORCE_COLOR: 0

jobs:
  matrix-test:
    name: Node ${{ matrix.node }} build + test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  full-gate:
    name: Node 24 full gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Check bundle boundaries
        run: npm run check:bundle
      - name: Check package metadata
        run: npm run check:package
      - name: Test
        run: npm run test
      - name: Coverage thresholds
        run: npm run test:coverage
      - name: Dates in every timezone
        run: npm run check:timezones
      - name: Consumer install from tarball
        run: npm run check:consumer
